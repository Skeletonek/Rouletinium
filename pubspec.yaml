name: rouletinium
description: Pandemonium Roulette
publish_to: 'none'
version: 1.0.0+100
# NOTE: After changing Flutter SDK (.fvmrc) or roulette (packages/roulette/pubspec.yaml),
# regenerate versions: dart tool/generate_versions.dart  -> lib/generated/versions.dart

flutter_icons:
  android: true
  ios: false
  image_path: "media/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "media/icon.png"
    background_color: "#ffffff"
    theme_color: "#0093ff"
  windows:
    generate: true
    image_path: "media/icon.png"
    icon_size: 48

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  roulette:
    path: packages/roulette
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^10.2.1
  dynamic_color: ^1.7.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - media/icon.png
    - media/skeletonek.jpg
