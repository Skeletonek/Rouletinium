name: rouletinium
description: Pandemonium Roulette
publish_to: 'none'
version: 0.4.0-git.2601200014+5

flutter_icons:
  android: true
  ios: false
  image_path: "media/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "media/icon.png"
    background_color: "#ffffff"
    theme_color: "#0093ff"
  windows:
    generate: true
    image_path: "media/icon.png"
    icon_size: 48

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  roulette:
    path: ./packages/roulette
  flutter_launcher_icons: ^0.14.0
  flutter_iconpicker: ^4.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
