id: com.skeletonek.rouletinium
name: Rouletinium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --share=network
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: com.skeletonek.rouletinium
    buildsystem: simple
    build-commands:
      - install -Dm644 icon256.png /app/share/icons/hicolor/256x256/apps/com.skeletonek.rouletinium.png
      - install -Dm644 icon128.png /app/share/icons/hicolor/128x128/apps/com.skeletonek.rouletinium.png
      - install -Dm644 icon64.png /app/share/icons/hicolor/64x64/apps/com.skeletonek.rouletinium.png
      - install -Dm644 rouletinium-flatpak.desktop /app/share/applications/com.skeletonek.rouletinium.desktop
      - bsdtar -xf rouletinium.deb data.tar.gz
      - bsdtar -xf data.tar.gz
      - ls -alh
      - mv usr/share/rouletinium /app/share/rouletinium
      - mkdir /app/bin
      - ln -s /app/share/rouletinium/Rouletinium /app/bin/com.skeletonek.rouletinium
    sources:
      - type: file
        dest-filename: rouletinium.deb
        path: ../build/rouletinium-0.5.0-x86_64.deb
      - type: file
        path: ../linux/rouletinium-flatpak.desktop
      - type: file
        path: ../media/logo/icon256.png
      - type: file
        path: ../media/logo/icon128.png
      - type: file
        path: ../media/logo/icon64.png
