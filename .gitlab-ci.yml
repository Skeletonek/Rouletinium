image: ghcr.io/gmeligio/flutter-web:3.47.2

before_script:
  - git config --global --add safe.directory "$CI_PROJECT_DIR"
  - git submodule update --init
  - flutter pub get

pages:
  stage: deploy
  script:
    - BASE_VER=$(grep '^version:' pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
    - BUILD_NO=$(grep '^version:' pubspec.yaml | grep -oE '\+[0-9]+' | tr -d '+' | head -n1)
    - BUILD_NO=${BUILD_NO:-0}
    - "sed -i -E \"s/^version: .*/version: ${BASE_VER}-git.${CI_COMMIT_SHORT_SHA:-dev}+${BUILD_NO}/\" pubspec.yaml"
    - flutter build web
    - cp -r build/web public
  artifacts:
    paths:
      - public
  only:
    - main
